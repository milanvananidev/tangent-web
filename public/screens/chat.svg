<svg viewBox="0 0 402 874" xmlns="http://www.w3.org/2000/svg">
  <rect width="402" height="874" fill="#0f0f0d"/>
  <text x="201" y="70" text-anchor="middle" fill="#f4f2ec" font-family="system-ui" font-size="18" font-weight="700">Ask AI</text>
  <!-- User bubble -->
  <rect x="120" y="160" width="258" height="44" rx="16" fill="#f4f2ec"/>
  <text x="140" y="186" fill="#15140f" font-family="system-ui" font-size="14">What did I commit to this week?</text>
  <!-- AI bubble -->
  <rect x="24" y="224" width="320" height="120" rx="16" fill="#1a1a17" stroke="rgba(255,252,240,0.07)" stroke-width="0.5"/>
  <text x="44" y="252" fill="#f4f2ec" font-family="system-ui" font-size="14">You committed to four things:</text>
  <text x="44" y="278" fill="#a3a097" font-family="system-ui" font-size="13">1. Send Maya the timeline</text>
  <text x="44" y="300" fill="#a3a097" font-family="system-ui" font-size="13">2. Draft the pitch deck intro</text>
  <text x="44" y="322" fill="#a3a097" font-family="system-ui" font-size="13">3. Book meeting room for Friday</text>
  <!-- User bubble 2 -->
  <rect x="160" y="370" width="218" height="44" rx="16" fill="#f4f2ec"/>
  <text x="180" y="396" fill="#15140f" font-family="system-ui" font-size="14">Which ones are overdue?</text>
  <!-- AI bubble 2 -->
  <rect x="24" y="434" width="300" height="80" rx="16" fill="#1a1a17" stroke="rgba(255,252,240,0.07)" stroke-width="0.5"/>
  <text x="44" y="462" fill="#f4f2ec" font-family="system-ui" font-size="14">One is overdue:</text>
  <text x="44" y="488" fill="#a3a097" font-family="system-ui" font-size="13">"Send Maya the timeline" — due</text>
  <text x="44" y="504" fill="#a3a097" font-family="system-ui" font-size="13">yesterday at 4pm.</text>
  <!-- Input bar -->
  <rect x="24" y="790" width="354" height="48" rx="14" fill="#1a1a17" stroke="rgba(255,252,240,0.07)" stroke-width="0.5"/>
  <text x="44" y="818" fill="#6d6b62" font-family="system-ui" font-size="14">Ask about your notes...</text>
</svg>
